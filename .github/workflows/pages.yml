name: Publicar menu de eventos
on:
  push:
    branches: [main]
    paths:
      - 'menu.html'
      - 'menu.js'
      - 'menu.css'
      - 'event.json'
      - 'index.html'
      - 'natal-layout.json'
      - 'natal-runtime.js'
      - 'natal-runtime.css'
      - 'assets/natal/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: eventos-pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
